upstream backend_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Timeouts — hardened for startup race & slow research endpoints.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
    proxy_send_timeout    30s;
    proxy_buffering       off;

    # Research API via Docker Compose internal network (service 'api')
    location /api/ {
        proxy_pass         http://backend_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;
    }

    # LLM narration / chat: narration can take up to 60s under free-tier rate limits.
    location /api/v1/companies/ {
        proxy_pass         http://backend_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_read_timeout    90s;
        proxy_send_timeout    30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

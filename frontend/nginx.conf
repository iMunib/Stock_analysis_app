server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Timeouts per WS2 — hardened for slow research endpoints and narration.
    proxy_connect_timeout 30s;
    proxy_read_timeout    120s;
    proxy_send_timeout    30s;
    proxy_buffering       off;

    # Research API on the host (Docker Desktop provides host.docker.internal).
    location /api/ {
        proxy_pass         http://host.docker.internal:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;
    }

    # LLM narration / chat: narration can take up to 60s under free-tier rate limits.
    location /api/v1/companies/ {
        proxy_pass         http://host.docker.internal:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout    90s;
        proxy_send_timeout    30s;
    }

    location / {
        try_files $uri /index.html;
    }
}

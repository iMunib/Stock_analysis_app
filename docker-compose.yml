services:
  api:
    build: ./backend
    container_name: invest-api
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      SEC_USER_AGENT: ${SEC_USER_AGENT:-InvestmentResearchApp contact@localhost}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    env_file:
      - path: .env
        required: false
    volumes:
      # Genesis-only seed — container reads it only on first boot when data/app.db is empty.
      # Runtime is fully decoupled: once SQLite exists, importer skips with millisecond log
      # "Excel seed reading skipped (database is primary durable store)" and never re-imports
      # unless --force. The Excel file is not required for normal restarts.
      - ./seed:/seed:ro
      - ./data:/app/data
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: sh -c "alembic upgrade head && python -m app.services.importer && python -m app.jobs.startup_pipeline --sync-only && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    profiles: ["frontend"]
    build: ./frontend
    container_name: invest-frontend
    ports:
      - "0.0.0.0:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

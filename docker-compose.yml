services:
  api:
    build: ./backend
    container_name: invest-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      SEC_USER_AGENT: ${SEC_USER_AGENT:-InvestmentResearchApp contact@localhost}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./seed:/seed:ro
      - ./data:/app/data
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: sh -c "alembic upgrade head && python -m app.services.importer && python -m app.jobs.startup_pipeline --sync-only && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    profiles: ["frontend"]
    build: ./frontend
    container_name: invest-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

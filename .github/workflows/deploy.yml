name: CI/CD — Test & Deploy to OCI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Verify — backend pytest + frontend vitest + Vite build
  # Runs on every push/PR; deploy gate depends on it.
  # ---------------------------------------------------------------------------
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests (pytest)
        working-directory: backend
        env:
          JOBS_WORKER_DISABLED: "1"
        run: python -m pytest tests/ -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests (vitest)
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend (tsc + vite)
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to OCI — only on push to main after tests pass
  # ---------------------------------------------------------------------------
  deploy-to-oci:
    needs: test-and-verify
    # Deploy only on push to main (not PRs, not manual dispatch unless on main)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH (pull + compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            echo "=== Deploying to OCI: $(hostname) @$(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

            # Ensure host packages exist
            if ! command -v git >/dev/null 2>&1; then
              echo "Installing git..."
              sudo apt-get update -y && sudo apt-get install -y git
            fi

            # Ensure directories exist and permissions are owned by ubuntu
            sudo mkdir -p /home/ubuntu/app/data/backups
            sudo chown -R ubuntu:ubuntu /home/ubuntu/app
            cd /home/ubuntu/app

            # Safe repository sync without deleting data/ or .env
            if [ ! -d ".git" ]; then
              echo "Initializing git repository..."
              git init
              git remote add origin https://github.com/iMunib/Stock_analysis_app.git
            fi

            echo "Fetching and syncing latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Commit: $(git rev-parse --short HEAD)"

            # Ensure Docker Compose runs cleanly
            docker compose --profile frontend down || true
            docker compose --profile frontend up --build -d

            echo "Waiting for healthcheck..."
            for i in $(seq 1 30); do
              if docker compose ps | grep -q "healthy\|Up"; then
                docker compose ps
                break
              fi
              sleep 2
            done

            echo "=== Deployment successful ==="
